<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathwork</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="home">
    <main>
        <h1>Breathwork</h1>
        <p>Just click and follow.</p>
        
        <nav>
            <button data-routine="morning">Morning</button>
            <button data-routine="midday">Midday</button>
            <button data-routine="evening">Evening</button>
        </nav>
        
        <a href="exercises.html">See exercises</a>
    </main>
    
    <script src="js/audio.js"></script>
    <script src="js/exercises.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service worker registered'))
                    .catch(err => console.log('Service worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
